<div id="proxyModal" class="modal">

    <div class="modal-content">

        <span class="modal-close" onclick="closeModal('proxyModal')">
            ✕
        </span>


        <h2>
            Добавить прокси
        </h2>


        <input
            type="text"
            id="proxyAddress"
            placeholder="IP:Port (например: 123.45.67.89:8080)"
            required
        >


        <input
            type="text"
            id="proxyLogin"
            placeholder="Логин"
            required
        >


        <input
            type="password"
            id="proxyPassword"
            placeholder="Пароль"
            required
        >


        <button
            type="button"
            class="btn-primary"
            onclick="addProxy()"
        >
            Добавить прокси
        </button>


    </div>

</div>
